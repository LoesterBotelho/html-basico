<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analytics</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="dashboard.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">
  <div class="d-flex flex-column flex-md-row min-vh-100">
    <aside class="sidebar bg-white border-end p-3 flex-shrink-0">
      <div class="nav nav-pills flex-row flex-md-column gap-2 overflow-auto text-nowrap pb-2 pb-md-0">
        <a href="dashboard.html" class="nav-link link-secondary d-flex align-items-center gap-2"><span>⊞</span> Dashboard</a>
        <a href="products.html" class="nav-link link-secondary d-flex align-items-center gap-2"><span>📦</span> Products</a>
        <a href="orders.html" class="nav-link link-secondary d-flex align-items-center gap-2"><span>🛒</span> Orders</a>
        <a href="customers.html" class="nav-link link-secondary d-flex align-items-center gap-2"><span>👤</span> Customers</a>
        <a href="analytics.html" class="nav-link active custom-active d-flex align-items-center gap-2"><span>📊</span> Analytics</a>
        <a href="settings.html" class="nav-link link-secondary d-flex align-items-center gap-2"><span>⚙️</span> Settings</a>
      </div>
    </aside>
    <div class="flex-grow-1 p-3 p-md-4 overflow-hidden">
      <header class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 fw-bold mb-0">Analytics</h1>
        <div class="d-flex align-items-center gap-3">
          <button class="btn btn-light btn-sm border-0 fs-5 p-1">📁</button>
          <button class="btn btn-light btn-sm border-0 fs-5 p-1">🔔</button>
          <div class="avatar bg-secondary-subtle rounded-circle" style="width: 36px; height: 36px;"></div>
        </div>
      </header>
      <main class="container-fluid p-0">
        <div class="row g-4">
          <div class="col-12">
            <div class="card border-0 shadow-sm rounded-4 p-4">
              <h2 class="h6 fw-bold mb-3">Sales Over Time</h2>
              <div class="chart-container" style="height: 320px;">
                <canvas id="salesChart"></canvas>
              </div>
            </div>
          </div>
          <div class="col-12">
            <div class="card border-0 shadow-sm rounded-4 p-4">
              <h2 class="h6 fw-bold mb-3">Top Products</h2>
              <div class="chart-container" style="height: 320px;">
                <canvas id="topProductsChart"></canvas>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="grafico.js"></script>
</body>
</html>
